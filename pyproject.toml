[project]
name = "opsdw"
version = "0.1.0"
description = "Operational analytics engineering vertical slice: synthetic delivery-platform warehouse on PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
opsdw = "opsdw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsdw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
